    function azzera(myInput, svgList) {
      document.getElementById(myInput).value = '';
      svgList = document.getElementsByClassName(svgList);
      for (var i = 0; i < svgList.length; i++) {
        svgList[i].style.display = "";
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      //const sprite = document.getElementById("svg");
      const sprite = $("#svg")[0];
      const symbols = sprite.querySelectorAll("symbol");
      var count = 1;

      //alert($("#svg").attr('id'));

      //document.write('<div id="svg-splitter">');
      //const svgsplitter = document.createElement('div');
      //svgsplitter.setAttribute('id','svg-splitter');
      //document.body.appendChild(svgsplitter);
      const svgsplitter = document.getElementById('sprite-viewer');

      symbols.forEach(symbol => {
        svgsplitter.insertAdjacentHTML("beforeend", `
          <svg class="svg-icon" id="svg___${symbol.id}" width="261" height="90" viewBox="-16 0 100 100">
            <use xlink:href="/assets-da/core/img/iconset/sprite.svg#${symbol.id}" width="50" height="50" href="/assets-da/core/img/iconset/sprite.svg#${symbol.id}" width="50" height="50" />
            <text class="fs-large mt-4 block" x="-80" y="80">${symbol.id}</text>
          </svg>
        `);
        count++;
      });
      return count;
    });
    // $('#icone_tot').text(count);

    function filterTextInput() {
      var input, radios, radio_filter, text_filter, td0, i, divList;
      input = document.getElementById("filter-sprite");
      text_filter = input.value.toUpperCase();
      svgList = document.getElementsByClassName("svg-icon");

      // Loop and hide those who don't match the search query
      for (i = 0; i < svgList.length; i++) {
        td0 = svgList[i].getAttribute('id');
        if (td0) {
          if (td0.toUpperCase().indexOf(text_filter) > -1) {
            svgList[i].style.display = "";
          } else {
            svgList[i].style.display = "none";
          }
        }
      }
    }
  </script>
