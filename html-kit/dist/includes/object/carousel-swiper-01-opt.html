<script>

        a11y: swiper_lang_it,
        keyboard: {
            enabled: true,
        },
        pagination: {
            el: mySwiperId+' .swiper-pagination',
            clickable: false,
            dynamicBullets: true
        },
        navigation: {
            nextEl: mySwiperId+' .swiper-btn-next',
            prevEl: mySwiperId+' .swiper-btn-prev',
        },
        // Custom config
        slidesPerView: 1,
        
        breakpoints: {
            768: {
                slidesPerView: 2
            },

                slidesPerView: 3,

        }

    const swiper = new Swiper(mySwiperId+' .swiper', swiper_args1);
